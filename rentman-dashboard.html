<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rentman Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<style>
  :root {
    --bg: #f5f4f1;
    --surface: #ffffff;
    --surface2: #f0eeea;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.2);
    --text: #1a1a18;
    --text-muted: #6b6b67;
    --text-faint: #9e9e9a;
    --orange: #ba7517;
    --orange-bg: #faeeda;
    --blue: #185fa5;
    --blue-bg: #e6f1fb;
    --green: #3b6d11;
    --green-bg: #eaf3de;
    --red: #a32d2d;
    --red-bg: #fcebeb;
    --purple: #534ab7;
    --purple-bg: #eeedfe;
    --radius: 10px;
    --radius-sm: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181816;
      --surface: #232320;
      --surface2: #2c2c2a;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.2);
      --text: #f0efe9;
      --text-muted: #a0a09a;
      --text-faint: #666662;
      --orange: #ef9f27;
      --orange-bg: #3a2800;
      --blue: #85b7eb;
      --blue-bg: #042c53;
      --green: #97c459;
      --green-bg: #173404;
      --red: #f09595;
      --red-bg: #501313;
      --purple: #afa9ec;
      --purple-bg: #26215c;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 15px; }
  body {
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 58px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-logo { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
  .header-logo span { color: var(--text-muted); font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 12px; }

  .token-pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 14px 5px 10px;
    font-size: 13px; color: var(--text-muted);
  }
  .token-pill i { font-size: 15px; }
  .token-pill .connected { color: var(--green); font-weight: 500; }
  .token-pill button {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 12px; padding: 0; margin-left: 4px;
    text-decoration: underline;
  }
  .token-pill button:hover { color: var(--text); }

  .token-input-wrap { display: flex; align-items: center; gap: 8px; }
  .token-input-wrap input {
    font-size: 13px; padding: 6px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: var(--surface2);
    color: var(--text);
    width: 230px;
    outline: none;
  }
  .token-input-wrap input:focus { border-color: var(--text); }
  .btn-connect {
    font-size: 13px; padding: 6px 16px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: var(--text); color: var(--surface);
    cursor: pointer; font-weight: 500;
  }
  .btn-connect:hover { opacity: .8; }

  .auto-refresh-label {
    font-size: 12px; color: var(--text-muted);
    display: flex; align-items: center; gap: 5px;
    cursor: pointer; user-select: none;
  }

  .main { max-width: 1200px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }

  .error-box {
    background: var(--red-bg); border: 1px solid var(--red);
    border-radius: var(--radius-sm); padding: .75rem 1rem;
    font-size: 13px; color: var(--red); margin-bottom: 1rem;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .error-box i { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 1.25rem;
  }
  @media (max-width: 800px) { .stats { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 480px) { .stats { grid-template-columns: repeat(2, 1fr); } }

  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: .9rem 1rem;
    cursor: pointer; transition: border-color .15s;
  }
  .stat:hover { border-color: var(--border-strong); }
  .stat.active { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
  .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .stat-val { font-size: 28px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .stat-val.orange { color: var(--orange); }
  .stat-val.blue   { color: var(--blue); }
  .stat-val.green  { color: var(--green); }
  .stat-val.red    { color: var(--red); }
  .stat-sub { font-size: 11px; color: var(--text-faint); margin-top: 4px; }

  .toolbar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 1rem; flex-wrap: wrap;
  }
  .search-wrap { position: relative; }
  .search-wrap i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--text-muted); pointer-events: none; }
  .search-wrap input {
    padding: 7px 12px 7px 32px; font-size: 13px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); outline: none; width: 240px;
  }
  .search-wrap input:focus { border-color: var(--border-strong); }

  .sort-select {
    font-size: 13px; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--surface); color: var(--text);
    outline: none; cursor: pointer;
  }

  .btn-refresh {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; padding: 7px 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text-muted); cursor: pointer;
  }
  .btn-refresh:hover { color: var(--text); border-color: var(--border-strong); }
  .btn-refresh.spinning i { animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .last-updated { font-size: 11px; color: var(--text-faint); }

  .section-head {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 8px; margin-top: 1.5rem;
    display: flex; align-items: center; gap: 8px;
  }
  .section-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .proj-list { display: flex; flex-direction: column; gap: 6px; }

  .proj-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .85rem 1.1rem;
    display: grid;
    grid-template-columns: 12px 1fr auto;
    align-items: center;
    gap: 14px;
    transition: border-color .1s;
  }
  .proj-card:hover { border-color: var(--border-strong); }
  .proj-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .proj-body { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .proj-number { font-size: 12px; color: var(--text-faint); min-width: 36px; }
  .proj-name { font-size: 14px; font-weight: 500; }
  .proj-location { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 3px; }
  .proj-location i { font-size: 13px; }
  .proj-note { font-size: 11px; font-weight: 600; }

  .proj-meta { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .proj-dates-block { text-align: right; }
  .proj-date-row { display: flex; align-items: center; gap: 6px; justify-content: flex-end; font-size: 12px; margin-bottom: 2px; }
  .proj-date-row .lbl { color: var(--text-faint); font-size: 11px; min-width: 38px; text-align: right; }
  .proj-date-row .val { font-weight: 500; min-width: 96px; text-align: right; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; padding: 3px 10px;
    border-radius: 999px; white-space: nowrap; flex-shrink: 0;
  }
  .badge i { font-size: 12px; }
  .badge-returning { background: var(--orange-bg); color: var(--orange); }
  .badge-departing  { background: var(--blue-bg);   color: var(--blue); }
  .badge-active     { background: var(--green-bg);  color: var(--green); }
  .badge-overdue    { background: var(--red-bg);    color: var(--red); }
  .badge-upcoming   { background: var(--purple-bg); color: var(--purple); }

  .empty-state {
    text-align: center; padding: 4rem 2rem;
    color: var(--text-muted); font-size: 14px;
  }
  .empty-state i { font-size: 40px; display: block; margin: 0 auto 12px; opacity: .4; }
  .empty-state p { max-width: 340px; margin: 0 auto; line-height: 1.6; }

  .loading-state {
    display: flex; align-items: center; gap: 10px;
    padding: 2.5rem 1rem; color: var(--text-muted); font-size: 14px;
  }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border-strong);
    border-top-color: var(--text);
    border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0;
  }

  @media (max-width: 700px) {
    .header { padding: 0 1rem; }
    .main { padding: 1rem; }
    .proj-card { grid-template-columns: 10px 1fr; }
    .proj-meta { display: none; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <i class="ti ti-calendar-event" style="font-size:20px;color:var(--text-muted)"></i>
    <div class="header-logo">Rentman <span>Operations</span></div>
  </div>
  <div class="header-right">
    <label class="auto-refresh-label">
      <input type="checkbox" id="auto-refresh-toggle" onchange="toggleAutoRefresh()" />
      Auto-refresh (5 min)
    </label>
    <div id="token-area"></div>
  </div>
</header>

<main class="main">
  <div id="error-area"></div>

  <div class="stats">
    <div class="stat" onclick="setFilter('overdue')" id="stat-overdue">
      <div class="stat-label">Overdue</div>
      <div class="stat-val red" id="s-overdue">–</div>
      <div class="stat-sub">past return date</div>
    </div>
    <div class="stat" onclick="setFilter('returning')" id="stat-returning">
      <div class="stat-label">Returning</div>
      <div class="stat-val orange" id="s-returning">–</div>
      <div class="stat-sub">due back</div>
    </div>
    <div class="stat" onclick="setFilter('active')" id="stat-active">
      <div class="stat-label">Active</div>
      <div class="stat-val green" id="s-active">–</div>
      <div class="stat-sub">currently out</div>
    </div>
    <div class="stat" onclick="setFilter('departing')" id="stat-departing">
      <div class="stat-label">Departing (7d)</div>
      <div class="stat-val blue" id="s-departing">–</div>
      <div class="stat-sub">going out soon</div>
    </div>
    <div class="stat" onclick="setFilter('all')" id="stat-all">
      <div class="stat-label">All loaded</div>
      <div class="stat-val" id="s-all">–</div>
      <div class="stat-sub">projects total</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" id="search-input" placeholder="Search name, number, location…" oninput="renderProjects()" />
    </div>
    <select class="sort-select" id="overdue-window" onchange="renderProjects()" style="border-color:var(--red);color:var(--red)" title="Overdue window (only affects Overdue filter)">
      <option value="7">Overdue: last 7 days</option>
      <option value="30">Overdue: last 30 days</option>
      <option value="all">Overdue: all time</option>
    </select>
    <select class="sort-select" id="returning-window" onchange="renderProjects()" style="border-color:var(--orange);color:var(--orange)" title="Returning window (only affects Returning filter)">
      <option value="1">Returning: today</option>
      <option value="2">Returning: today &amp; tomorrow</option>
      <option value="7" selected>Returning: next 7 days</option>
      <option value="30">Returning: next 30 days</option>
      <option value="all">Returning: all</option>
    </select>
    <select class="sort-select" id="departing-window" onchange="renderProjects()" style="border-color:var(--blue);color:var(--blue)" title="Departing window (only affects Departing filter)">
      <option value="1">Departing: today</option>
      <option value="2">Departing: today &amp; tomorrow</option>
      <option value="7" selected>Departing: next 7 days</option>
      <option value="30">Departing: next 30 days</option>
      <option value="all">Departing: all</option>
    </select>
    <select class="sort-select" id="sort-select" onchange="renderProjects()">
      <option value="end-desc">Sort: Return date ↓ (newest)</option>
      <option value="end-asc">Sort: Return date ↑</option>
      <option value="start-asc">Sort: Start date ↑</option>
      <option value="number-asc">Sort: Project # ↑</option>
    </select>
    <div class="toolbar-right">
      <span class="last-updated" id="last-updated"></span>
      <button class="btn-refresh" id="refresh-btn" onclick="fetchData()">
        <i class="ti ti-refresh"></i> Refresh
      </button>
    </div>
  </div>

  <div id="projects-area">
    <div class="empty-state">
      <i class="ti ti-plug-connected"></i>
      <p>Enter your Rentman API token in the top-right corner to get started.</p>
    </div>
  </div>
</main>

<script>
// ── Cookie + localStorage helpers ───────────────────────────────
function setCookie(name, value, days) {
  var d = new Date();
  d.setTime(d.getTime() + days * 86400000);
  document.cookie = name + '=' + encodeURIComponent(value) + ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
}
function getCookie(name) {
  var v = document.cookie.split(';').map(function(c){ return c.trim(); }).find(function(c){ return c.startsWith(name + '='); });
  return v ? decodeURIComponent(v.split('=')[1]) : null;
}
function deleteCookie(name) {
  document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;';
}
function saveToken(t) {
  try { setCookie('rm_api_token', t, 365); } catch(e) {}
  try { localStorage.setItem('rm_api_token', t); } catch(e) {}
}
function loadToken() {
  return getCookie('rm_api_token') || (function(){ try { return localStorage.getItem('rm_api_token'); } catch(e) { return null; } })() || null;
}
function removeToken() {
  deleteCookie('rm_api_token');
  try { localStorage.removeItem('rm_api_token'); } catch(e) {}
}

// ── State ───────────────────────────────────────────────────────
var allProjects = [];
var currentFilter = 'all';
var autoRefreshTimer = null;

// ── Token UI ────────────────────────────────────────────────────
function renderTokenArea() {
  var token = loadToken();
  var area = document.getElementById('token-area');
  if (token) {
    area.innerHTML = '<div class="token-pill"><i class="ti ti-circle-check" style="color:var(--green)"></i><span class="connected">Connected</span><button onclick="disconnectToken()">Change token</button></div>';
  } else {
    area.innerHTML = '<div class="token-input-wrap"><input type="password" id="token-field" placeholder="Paste API token\u2026" onkeydown="if(event.key===\'Enter\')connectToken()" /><button class="btn-connect" onclick="connectToken()">Connect</button></div>';
  }
}

function connectToken() {
  var field = document.getElementById('token-field');
  var t = field ? field.value.trim() : '';
  if (!t) { showError('Please paste your Rentman API token first.'); return; }
  saveToken(t);
  clearError();
  renderTokenArea();
  fetchData();
}

function disconnectToken() {
  removeToken();
  allProjects = [];
  renderTokenArea();
  updateStats([]);
  document.getElementById('last-updated').textContent = '';
  document.getElementById('projects-area').innerHTML = '<div class="empty-state"><i class="ti ti-plug-connected"></i><p>Enter your Rentman API token in the top-right corner to get started.</p></div>';
}

// ── Error ────────────────────────────────────────────────────────
function showError(msg) {
  document.getElementById('error-area').innerHTML = '<div class="error-box"><i class="ti ti-alert-circle"></i><span>' + msg + '</span></div>';
}
function clearError() { document.getElementById('error-area').innerHTML = ''; }

// ── Fetch ────────────────────────────────────────────────────────
function fetchData() {
  var token = loadToken();
  if (!token) return;
  clearError();
  var btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  document.getElementById('projects-area').innerHTML = '<div class="loading-state"><div class="spinner"></div> Loading projects from Rentman…</div>';

  function normalise(p) {
    return {
      id: p.id,
      name: p.name || p.displayname || '(unnamed)',
      number: p.number || p.project_number || p.id,
      planperiod_start: p.planperiod_start || p.period_from || p.date_period_start || p.start || null,
      planperiod_end:   p.planperiod_end   || p.period_to   || p.date_period_end   || p.end   || null,
      status: p.status,
      location_name: p.location_name || p.location || p.venue || ''
    };
  }

  fetch('/api/projects?limit=300&sort=-number', {
    headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
  }).then(function(res) {
    if (res.status === 401) {
      showError('Invalid API token — please disconnect and enter a valid token.');
      btn.classList.remove('spinning');
      return null;
    }
    if (!res.ok) {
      return res.text().then(function(txt) {
        showError('Rentman API returned ' + res.status + ': ' + txt.slice(0,200));
        btn.classList.remove('spinning');
        return null;
      });
    }
    return res.json();
  }).then(function(data) {
    if (!data) return;
    var raw = data.data || data || [];
    if (raw.length > 0) {
      console.log('Rentman fields:', Object.keys(raw[0]));
      raw.slice(0,5).forEach(function(p) {
        var n = normalise(p);
        console.log(n.name, '| start:', dateOnly(n.planperiod_start), '| end:', dateOnly(n.planperiod_end), '| class:', classify(n));
      });
    }
    allProjects = raw.filter(function(p){
      return p.planperiod_end || p.planperiod_start || p.period_from || p.period_to;
    }).map(normalise);
    updateStats(allProjects);
    renderProjects();
    document.getElementById('last-updated').textContent =
      'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) +
      ' — ' + allProjects.length + ' projects';
    btn.classList.remove('spinning');
  }).catch(function(e) {
    showError('Could not reach the proxy. Make sure rentman-proxy.py is running. Error: ' + e.message);
    document.getElementById('projects-area').innerHTML = '';
    btn.classList.remove('spinning');
  });
}

// ── Auto-refresh ──────────────────────────────────────────────────
function toggleAutoRefresh() {
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
  if (document.getElementById('auto-refresh-toggle').checked) {
    autoRefreshTimer = setInterval(fetchData, 5 * 60 * 1000);
  }
}

// ── Classify ──────────────────────────────────────────────────────
function todayMidnight() { var d = new Date(); d.setHours(0,0,0,0); return d; }

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function offsetDateStr(days) {
  var d = new Date(); d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dateOnly(str) {
  if (!str) return null;
  // Handle both "2026-06-10" and "2026-06-10T00:00:00" formats
  return str.substring(0, 10);
}
function classify(p) {
  var today  = todayStr();
  var start  = dateOnly(p.planperiod_start);
  var end    = dateOnly(p.planperiod_end);
  if (!end && !start) return 'upcoming';
  // Overdue: end date is in the past
  if (end && end < today) return 'overdue';
  // Departing: starts in the future
  if (start && start > today) return 'departing';
  // Active: started (or no start date) and end date is in the future
  if (end && end >= today) return 'active';
  // Active: started but no end date
  if (start && start <= today) return 'active';
  return 'upcoming';
}

// Returning = active projects whose end date falls within the selected window
function isReturningProject(p) {
  return classify(p) === 'active';
}

function isOverdueInWindow(p) {
  var end = dateOnly(p.planperiod_end);
  if (!end) return false;
  var today = todayStr();
  if (end >= today) return false; // not overdue
  var sel = document.getElementById('overdue-window');
  var win = sel ? sel.value : '7';
  if (win === 'all') return true;
  var days = parseInt(win);
  var cutoff = offsetDateStr(-days);
  return end >= cutoff;
}

function isReturningInWindow(p) {
  if (classify(p) !== 'active') return false;
  var end = dateOnly(p.planperiod_end);
  if (!end) return false;
  var sel = document.getElementById('returning-window');
  var win = sel ? sel.value : '7';
  if (win === 'all') return true;
  var days = parseInt(win);
  var cutoff = offsetDateStr(days);
  return end < cutoff;
}

function returningDayLabel(p) {
  var d = daysFromNow(p.planperiod_end);
  if (d === null) return '';
  if (d === 0) return 'today';
  if (d === 1) return 'tomorrow';
  if (d <= 6) return 'in ' + d + ' days';
  return 'in ' + d + 'd';
}

function isDepartingInWindow(p) {
  var start = dateOnly(p.planperiod_start);
  if (!start) return false;
  var today = todayStr();
  if (start < today) return false; // already started
  var sel = document.getElementById('departing-window');
  var win = sel ? sel.value : '7';
  if (win === 'all') return true;
  var days = parseInt(win);
  var cutoff = offsetDateStr(days);
  return start < cutoff;
}

function departingDayLabel(p) {
  var d = daysFromNow(p.planperiod_start);
  if (d === null) return '';
  if (d === 0) return 'today';
  if (d === 1) return 'tomorrow';
  if (d <= 6) return 'in ' + d + ' days';
  return 'in ' + d + 'd';
}

function daysFromNow(str) {
  if (!str) return null;
  var s = str.substring(0, 10); // "2026-06-10"
  var parts = s.split('-');
  var d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  var now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}

function fmtDate(str) {
  if (!str) return '\u2013';
  return new Date(str).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Stats ─────────────────────────────────────────────────────────
function updateStats(projects) {
  var overdue=0, returning=0, active=0, departing=0;
  projects.forEach(function(p) {
    var c = classify(p);
    if (c==='overdue') overdue++;
    else if (c==='active') {
      active++;
      if (isReturningInWindow(p)) returning++;
    }
    else if (c==='departing') departing++;
  });
  document.getElementById('s-overdue').textContent   = overdue;
  document.getElementById('s-returning').textContent = returning;
  document.getElementById('s-active').textContent    = active;
  document.getElementById('s-departing').textContent = departing;
  document.getElementById('s-all').textContent       = projects.length;
}

// ── Filter ────────────────────────────────────────────────────────
function setFilter(f) {
  currentFilter = f;
  ['all','overdue','returning','active','departing'].forEach(function(k) {
    var el = document.getElementById('stat-' + k);
    if (el) el.classList.toggle('active', k === f);
  });
  var ow = document.getElementById('overdue-window');
  if (ow) ow.style.display = (f === 'overdue') ? '' : 'none';
  var rw = document.getElementById('returning-window');
  if (rw) rw.style.display = (f === 'returning') ? '' : 'none';
  var dw = document.getElementById('departing-window');
  if (dw) dw.style.display = (f === 'departing') ? '' : 'none';
  renderProjects();
}

// ── Render ────────────────────────────────────────────────────────
function renderProjects() {
  var search = (document.getElementById('search-input').value || '').toLowerCase().trim();
  var sort   = document.getElementById('sort-select').value;

  var list = allProjects.filter(function(p) {
    var c = classify(p);
    var mf;
    if (currentFilter === 'overdue') {
      mf = (c === 'overdue') && isOverdueInWindow(p);
    } else if (currentFilter === 'returning') {
      mf = isReturningInWindow(p);
    } else if (currentFilter === 'departing') {
      mf = (c === 'departing') && isDepartingInWindow(p);
    } else {
      mf = currentFilter === 'all' || c === currentFilter;
    }
    var ms = !search
      || (p.name||'').toLowerCase().indexOf(search) !== -1
      || String(p.number||'').indexOf(search) !== -1
      || (p.location_name||'').toLowerCase().indexOf(search) !== -1;
    return mf && ms;
  });

  list.sort(function(a, b) {
    // Departing filter: always sort by start date ascending (soonest first)
    if (currentFilter === 'departing') {
      return (a.planperiod_start||'9999').localeCompare(b.planperiod_start||'9999');
    }
    if (sort === 'end-asc')    return (a.planperiod_end||'9999').localeCompare(b.planperiod_end||'9999');
    if (sort === 'end-desc')   return (b.planperiod_end||'9999').localeCompare(a.planperiod_end||'9999');
    if (sort === 'start-asc')  return (a.planperiod_start||'9999').localeCompare(b.planperiod_start||'9999');
    if (sort === 'number-asc') return (a.number||0) - (b.number||0);
    return 0;
  });

  if (!list.length) {
    var msg = allProjects.length === 0
      ? '<p>No projects loaded yet. Check your API token and click Refresh.</p>'
      : '<p>No projects match the current filter or search.</p>';
    document.getElementById('projects-area').innerHTML = '<div class="empty-state"><i class="ti ti-mood-empty"></i>' + msg + '</div>';
    return;
  }

  var dotColor  = { returning:'var(--orange)', departing:'var(--blue)', active:'var(--green)', overdue:'var(--red)', upcoming:'var(--text-faint)' };
  var badgeCls  = { returning:'badge-returning', departing:'badge-departing', active:'badge-active', overdue:'badge-overdue', upcoming:'badge-upcoming' };
  var badgeLbl  = { returning:'Returning', departing:'Departing', active:'Active', overdue:'Overdue', upcoming:'Upcoming' };
  var badgeIcon = { returning:'ti-package-import', departing:'ti-truck', active:'ti-clock-play', overdue:'ti-alert-triangle', upcoming:'ti-calendar' };
  var noteColor = { overdue:'var(--red)', returning:'var(--orange)', departing:'var(--blue)', active:'var(--green)', upcoming:'var(--text-faint)' };

  var groups = [
    { key:'overdue',   label:'Overdue returns' },
    { key:'returning', label:'Returning' },
    { key:'active',    label:'Currently active' },
    { key:'departing', label:'Departing soon' },
    { key:'upcoming',  label:'Upcoming' }
  ];

  var html = '';
  if (currentFilter === 'all') {
    groups.forEach(function(g) {
      var items = list.filter(function(p){ return classify(p) === g.key; });
      if (!items.length) return;
      html += '<div class="section-head">' + g.label + ' <span style="color:var(--text-faint);font-weight:400">' + items.length + '</span></div>';
      html += '<div class="proj-list">' + items.map(function(p){ return projCard(p, badgeCls, badgeLbl, badgeIcon, dotColor, noteColor); }).join('') + '</div>';
    });
  } else {
    html = '<div class="proj-list">' + list.map(function(p){ return projCard(p, badgeCls, badgeLbl, badgeIcon, dotColor, noteColor); }).join('') + '</div>';
  }

  document.getElementById('projects-area').innerHTML = html;
}

function projCard(p, badgeCls, badgeLbl, badgeIcon, dotColor, noteColor) {
  var c = classify(p);
  var dEnd   = daysFromNow(p.planperiod_end);
  var dStart = daysFromNow(p.planperiod_start);
  var note = '';
  if (c === 'overdue')    note = '<span class="proj-note" style="color:' + noteColor.overdue + '">' + Math.abs(dEnd) + 'd overdue</span>';
  else if (c === 'returning') note = '<span class="proj-note" style="color:' + noteColor.returning + '">Returns ' + returningDayLabel(p) + '</span>';
  else if (c === 'departing') note = '<span class="proj-note" style="color:' + noteColor.departing + '">Departs ' + departingDayLabel(p) + '</span>';
  else if (c === 'active' && dEnd !== null) note = '<span class="proj-note" style="color:' + noteColor.active + '">Due back in ' + dEnd + 'd</span>';

  var location = p.location_name
    ? '<span class="proj-location"><i class="ti ti-map-pin"></i>' + escHtml(p.location_name) + '</span>' : '';

  return '<div class="proj-card">'
    + '<div class="proj-dot" style="background:' + (dotColor[c]||'var(--text-faint)') + '"></div>'
    + '<div class="proj-body">'
    +   '<span class="proj-number">#' + (p.number||'?') + '</span>'
    +   '<span class="proj-name">' + escHtml(p.name||'Unnamed project') + '</span>'
    +   location
    +   note
    + '</div>'
    + '<div class="proj-meta">'
    +   '<div class="proj-dates-block">'
    +     '<div class="proj-date-row"><span class="lbl">Start</span><span class="val">' + fmtDate(p.planperiod_start) + '</span></div>'
    +     '<div class="proj-date-row"><span class="lbl">Return</span><span class="val">' + fmtDate(p.planperiod_end) + '</span></div>'
    +   '</div>'
    +   '<span class="badge ' + (badgeCls[c]||'badge-upcoming') + '"><i class="ti ' + (badgeIcon[c]||'ti-calendar') + '"></i>' + (badgeLbl[c]||c) + '</span>'
    + '</div>'
    + '</div>';
}

// ── Init ──────────────────────────────────────────────────────────
renderTokenArea();
// Hide overdue window selector by default (shown only when overdue filter active)
var owEl = document.getElementById('overdue-window');
if (owEl) owEl.style.display = 'none';
var rwEl = document.getElementById('returning-window');
if (rwEl) rwEl.style.display = 'none';
var dwEl = document.getElementById('departing-window');
if (dwEl) dwEl.style.display = 'none';
if (loadToken()) fetchData();
</script>
